# version: '3.8'  # Removed to avoid warning

services:
  resshare-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resshare-backend
    ports:
      - "5000:5000"
      - "18080:8080"  # IPFS Gateway (host port changed to avoid 8080 conflict)
      - "9094:9094"  # IPFS Cluster API
    environment:
      # Set your Google API key here or use .env file
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - FLASK_ENV=production
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      # Add your Vercel or other frontend URLs (comma-separated)
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - STORAGE_TYPE=${STORAGE_TYPE}
      - KV_SERVICE_URL=${KV_SERVICE_URL}
      - QDRANT_VECTOR_DB_URL=${QDRANT_VECTOR_DB_URL:-http://qdrant:6333}
      # Answers come from a local OpenAI-compatible server. host.docker.internal
      # reaches Ollama (or similar) running on the machine that runs Compose.
      - LOCAL_LLM_BASE_URL=${LOCAL_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-llama3.2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
    volumes:
      # Persist IPFS data
      - ipfs_data:/root/.ipfs
      # Persist IPFS Cluster data
      - ipfs_cluster_data:/root/.ipfs-cluster
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/ && curl -fsS -X POST http://localhost:5001/api/v0/version && curl -fsS http://localhost:9094/id"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s

  qdrant:
    image: qdrant/qdrant:v1.18.1
    container_name: resshare-qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: "no"

volumes:
  ipfs_data:
  ipfs_cluster_data:
  qdrant_data:
