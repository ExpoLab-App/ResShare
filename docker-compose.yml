# version: '3.8'  # Removed to avoid warning

services:
  resshare-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resshare-backend
    ports:
      - "5000:5000"
      - "18080:8080"  # IPFS Gateway (host port changed to avoid 8080 conflict)
      - "9094:9094"  # IPFS Cluster API
    environment:
      - LOCAL_LLM_BASE_URL=${LOCAL_LLM_BASE_URL:-http://host.docker.internal:8081/v1}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-resshare-local}
      - LOCAL_LLM_TIMEOUT=${LOCAL_LLM_TIMEOUT:-120}
      - RAG_COLLECTION=${RAG_COLLECTION:-resshare_bge_small_en_v15_v1}
      - FASTEMBED_CACHE_PATH=/app/model-cache
      - FLASK_ENV=production
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      # Add your Vercel or other frontend URLs (comma-separated)
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - STORAGE_TYPE=${STORAGE_TYPE}
      - KV_SERVICE_URL=${KV_SERVICE_URL}
      - QDRANT_VECTOR_DB_URL=${QDRANT_VECTOR_DB_URL:-http://qdrant:6333}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
    volumes:
      - model_cache:/app/model-cache
      # Persist IPFS data
      - ipfs_data:/root/.ipfs
      # Persist IPFS Cluster data
      - ipfs_cluster_data:/root/.ipfs-cluster
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/ && curl -f http://localhost:8080/api/v0/version && curl -f http://localhost:9094/api/v0/id"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s

  qdrant:
    image: qdrant/qdrant:v1.18.1
    container_name: resshare-qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: "no"

volumes:
  model_cache:
  ipfs_data:
  ipfs_cluster_data:
  qdrant_data:
